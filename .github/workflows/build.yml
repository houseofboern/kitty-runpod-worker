name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: jlumbroso/free-disk-space@main
        with: { tool-cache: true }
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: runpod-workers/worker-comfyui, ref: '5.11.0', path: upstream }
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: base (Runpod recipe, ComfyUI 0.42.1)
        run: docker build --target base --build-arg COMFYUI_VERSION=0.42.1 -t kitty-base:local upstream
      - name: ours
        run: |
          docker build -t ghcr.io/houseofboern/kitty-runpod-worker:0421 .
          docker push ghcr.io/houseofboern/kitty-runpod-worker:0421
